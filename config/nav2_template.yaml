/**:
  controller_server:
    ros__parameters:
      use_sim_time: True
      controller_frequency: 10.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      controller_plugins: ["FollowPath"]
      progress_checker_plugin: "progress_checker"
      goal_checker_plugins: ["general_goal_checker"]
      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        movement_time_allowance: 10.0
      general_goal_checker:
        stateful: True
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.20
        yaw_goal_tolerance: 0.20
      FollowPath:
        plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
        desired_linear_vel: 0.5
        lookahead_dist: 0.6
        min_lookahead_dist: 0.3
        max_lookahead_dist: 0.9
        lookahead_time: 1.5
        use_velocity_scaled_lookahead_dist: true
        transform_tolerance: 0.2
        use_regulated_linear_velocity_scaling: true
        regulated_linear_scaling_min_radius: 0.9
        regulated_linear_scaling_min_speed: 0.1
        use_rotate_to_heading: true
        rotate_to_heading_min_angle: 0.785
        rotate_to_heading_angular_vel: 0.6
        max_angular_accel: 1.5
        use_collision_detection: true
        max_allowed_time_to_collision_up_to_fast_stop: 1.0

  planner_server:
    ros__parameters:
      use_sim_time: True
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: "nav2_navfn_planner::NavfnPlanner"

  behavior_server:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: <ROBOT_NAME>/base_footprint
      local_frame: <ROBOT_NAME>/odom

  bt_navigator:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: <ROBOT_NAME>/base_footprint
      odom_topic: /<ROBOT_NAME>/odom

  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: True
        global_frame: <ROBOT_NAME>/odom
        robot_base_frame: <ROBOT_NAME>/base_footprint
        update_frequency: 5.0
        publish_frequency: 2.0
        rolling_window: True
        width: 4
        height: 4
        resolution: 0.05
        footprint: "[[0.47, 0.34], [0.47, -0.34], [-0.47, -0.34], [-0.47, 0.34]]"
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          observation_sources: scan
          scan:
            topic: /<ROBOT_NAME>/scan
            data_type: "LaserScan"
            clearing: True
            marking: True
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          inflation_radius: 0.75
          cost_scaling_factor: 3.5

  global_costmap:
    global_costmap:
      ros__parameters:
        use_sim_time: True
        global_frame: map
        robot_base_frame: <ROBOT_NAME>/base_footprint
        update_frequency: 2.0
        publish_frequency: 1.0
        footprint: "[[0.47, 0.34], [0.47, -0.34], [-0.47, -0.34], [-0.47, 0.34]]"
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: True
          map_topic: "/map"
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          observation_sources: scan
          scan:
            topic: /<ROBOT_NAME>/scan
            data_type: "LaserScan"
            clearing: True
            marking: True
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          inflation_radius: 0.75
          cost_scaling_factor: 3.5

  waypoint_follower:
    ros__parameters:
      use_sim_time: True
      loop_rate: 200
      stop_on_failure: False

  velocity_smoother:
    ros__parameters:
      use_sim_time: True
      odom_topic: /<ROBOT_NAME>/odom

  smoother_server:
    ros__parameters:
      use_sim_time: True

  route_server:
    ros__parameters:
      use_sim_time: True

  collision_monitor:
    ros__parameters:
      use_sim_time: True
      base_frame_id: <ROBOT_NAME>/base_footprint
      odom_frame_id: <ROBOT_NAME>/odom
      cmd_vel_in_topic: cmd_vel_smoothed
      cmd_vel_out_topic: cmd_vel
      observation_sources: ["scan"]
      scan:
        type: "scan"
        topic: /<ROBOT_NAME>/scan
      polygons: ["PolygonStop"]
      PolygonStop:
        type: "polygon"
        points: "[[0.55, 0.35], [0.55, -0.35], [-0.48, -0.35], [-0.48, 0.35]]"
        action_type: "stop"
        min_points: 4
        visualize: True
        polygon_pub_topic: "polygon_stop"

  docking_server:
    ros__parameters:
      use_sim_time: True
      base_frame: <ROBOT_NAME>/base_footprint
      odom_frame: <ROBOT_NAME>/odom
      dock_plugins: ["simple_charging_dock"]
      simple_charging_dock:
        plugin: "opennav_docking::SimpleChargingDock"
        docking_threshold: 0.05
        staging_distance: 0.5
        use_battery_status: False
